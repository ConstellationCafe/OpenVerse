name: release-zip

# The zip players download: built on Windows (the launcher and setup are Windows programs) whenever main changes,
# i.e. when a pull request is merged, and on pull requests into main so a broken build shows up before the merge.
# Only a push to main publishes it to the Releases page; pull requests just build and check it.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # be_url.txt in the zip points here out of the box. cafe_key.txt is left empty
  BE_URL: https://constellationcafe.p-e.kr/openverse

jobs:
  zip:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # no card master here: the zip never carries one, each player extracts their own with openverse-setup
      - name: Build release
        shell: pwsh
        run: ./build-release.ps1 -NoCardMaster -BeUrl "$env:BE_URL"

      - name: Check the zip
        shell: pwsh
        run: |
          Expand-Archive OpenVerse.zip -DestinationPath dist/OpenVerse -Force
          $root = "dist/OpenVerse"
          foreach ($f in "openverse-launcher.exe", "openverse-setup.exe", "be_url.txt", "cafe_key.txt", "username.txt",
                         "server/OpenVerse.Api.exe", "server/OpenVerse.Battle.exe") {
            if (-not (Test-Path (Join-Path $root $f))) { throw "missing from the zip: $f" }
          }
          $url = Get-Content (Join-Path $root "be_url.txt") | ForEach-Object { $_.Trim() } |
                 Where-Object { $_ -and -not $_.StartsWith("#") } | Select-Object -First 1
          if ($url -ne $env:BE_URL) { throw "be_url.txt reads '$url', expected '$env:BE_URL'" }
          $key = Get-Content (Join-Path $root "cafe_key.txt") | ForEach-Object { $_.Trim() } |
                 Where-Object { $_ -and -not $_.StartsWith("#") }
          if ($key) { throw "cafe_key.txt should be empty, reads '$key'" }
          $mb = [math]::Round((Get-Item OpenVerse.zip).Length / 1MB, 1)
          Write-Output "::notice title=zip::OpenVerse.zip $mb MB, be_url=$url, cafe_key empty"

      - uses: actions/upload-artifact@v4
        with:
          # downloading the artifact gives the zip contents directly (no zip inside a zip)
          name: OpenVerse-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.sha }}
          path: dist/OpenVerse
          retention-days: 90

      # the zip itself, for the publish job below
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-zip
          path: OpenVerse.zip
          retention-days: 7

  # A release per merge, with the zip attached as OpenVerse.zip, so players need no GitHub account and one link always
  # gives the newest: https://github.com/<owner>/<repo>/releases/latest/download/OpenVerse.zip
  publish:
    needs: zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # the only job allowed to write: creating the release and its tag
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f OpenVerse.zip
          day=$(TZ=Asia/Seoul date +%Y.%m.%d)
          short=${SHA::7}
          tag="v${day}-${short}"
          {
            echo "## 설치"
            echo
            echo "1. \`OpenVerse.zip\`을 받아 압축을 풉니다."
            echo "2. \`openverse-setup.exe\`를 실행합니다. (처음 한 번. 셰도우버스 클라이언트에서 카드 데이터를 추출합니다)"
            echo "3. \`openverse-launcher.exe\`를 실행합니다. 관리자 권한 요청은 허용합니다."
            echo
            echo "\`be_url.txt\`는 \`${BE_URL}\`로 설정되어 있습니다. \`cafe_key.txt\`는 비어 있습니다."
            echo
            echo "항상 최신판: https://github.com/${REPO}/releases/latest/download/OpenVerse.zip"
            echo
          } > notes.md
          gh release create "$tag" OpenVerse.zip \
            --repo "$REPO" --target "$SHA" \
            --title "OpenVerse ${day} (${short})" \
            --notes-file notes.md --generate-notes --latest
          echo "::notice title=release::https://github.com/${REPO}/releases/tag/${tag}"
