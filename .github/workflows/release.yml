name: release-zip

# The zip players download: built on Windows (the launcher and setup are Windows programs) whenever main changes,
# i.e. when a pull request is merged, and on pull requests into main so a broken build shows up before the merge.
# Only a push to main publishes it to the Releases page; pull requests just build and check it.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # be_url.txt in the zip points here out of the box. cafe_key.txt is left empty
  BE_URL: https://constellationcafe.p-e.kr/openverse

jobs:
  zip:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # no card master here: the zip never carries one, each player extracts their own with openverse-setup
      - name: Build release
        shell: pwsh
        run: ./build-release.ps1 -NoCardMaster -BeUrl "$env:BE_URL"

      - name: Check the zip
        shell: pwsh
        run: |
          Expand-Archive OpenVerse.zip -DestinationPath dist/OpenVerse -Force
          $root = "dist/OpenVerse"
          foreach ($f in "openverse-launcher.exe", "openverse-setup.exe", "be_url.txt", "cafe_key.txt", "username.txt",
                         "server/OpenVerse.Api.exe", "server/OpenVerse.Battle.exe") {
            if (-not (Test-Path (Join-Path $root $f))) { throw "missing from the zip: $f" }
          }
          $url = Get-Content (Join-Path $root "be_url.txt") | ForEach-Object { $_.Trim() } |
                 Where-Object { $_ -and -not $_.StartsWith("#") } | Select-Object -First 1
          if ($url -ne $env:BE_URL) { throw "be_url.txt reads '$url', expected '$env:BE_URL'" }
          $key = Get-Content (Join-Path $root "cafe_key.txt") | ForEach-Object { $_.Trim() } |
                 Where-Object { $_ -and -not $_.StartsWith("#") }
          if ($key) { throw "cafe_key.txt should be empty, reads '$key'" }
          $mb = [math]::Round((Get-Item OpenVerse.zip).Length / 1MB, 1)
          Write-Output "::notice title=zip::OpenVerse.zip $mb MB, be_url=$url, cafe_key empty"

      - name: Build the installer
        shell: pwsh
        run: >-
          dotnet publish tools/OpenVerse.Installer/OpenVerse.Installer.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist/installer

      # Runs the installer the way a player would, against the zip just built and against the newest real release
      - name: Check the installer
        shell: pwsh
        env:
          OPENVERSE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path dist/installer/OpenVerse-Installer.exe).Path
          function Run([string[]]$a) { & $exe @a | Out-Host; return $LASTEXITCODE }
          function Must([bool]$ok, [string]$why) { if (-not $ok) { throw $why } }
          function SettingValue($f) { Get-Content $f | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith("#") } | Select-Object -First 1 }

          # a stand-in card master (a gzip'd CSV over 100 rows): the real one is never in CI
          $fake = Join-Path $env:RUNNER_TEMP "fake_card_master.csv.gz"
          $fs = [IO.File]::Create($fake)
          $gz = New-Object IO.Compression.GZipStream($fs, [IO.Compression.CompressionMode]::Compress)
          $w = New-Object IO.StreamWriter($gz)
          1..150 | ForEach-Object { $w.WriteLine("$_,card") }
          $w.Close()

          # 1. fresh install from the zip just built, card master given, shortcut made
          $d1 = Join-Path $env:RUNNER_TEMP "ov-install"
          $desk = Join-Path $env:RUNNER_TEMP "desk"; New-Item -ItemType Directory -Force $desk | Out-Null
          Must ((Run @("--zip", "OpenVerse.zip", "--tag", "ci1", "--dir", $d1, "--card-master", $fake, "--yes", "--shortcut-dir", $desk)) -eq 0) "fresh install failed"
          foreach ($f in "openverse-launcher.exe", "openverse-setup.exe", "server/OpenVerse.Api.exe", "server/data/card_master_full.csv.gz") {
            Must (Test-Path (Join-Path $d1 $f)) "missing after install: $f"
          }
          Must ((Get-Content (Join-Path $d1 "installed-version.txt")) -eq "ci1") "version not recorded"
          Must ((SettingValue (Join-Path $d1 "be_url.txt")) -eq $env:BE_URL) "be_url.txt not as released"
          Must (Test-Path (Join-Path $desk "OpenVerse.lnk")) "no shortcut"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenVerse"
          $reg = Get-ItemProperty $key
          Must ($reg.DisplayName -eq "OpenVerse" -and $reg.DisplayVersion -eq "ci1" -and $reg.InstallLocation -eq $d1) "not registered in Programs and Features"
          Must ($reg.UninstallString -like "*--uninstall*") "no uninstall command registered"

          # 2. update over it: the card master and a filled-in setting survive, the version moves
          Add-Content (Join-Path $d1 "cafe_key.txt") "player-key"
          Must ((Run @("--zip", "OpenVerse.zip", "--tag", "ci2", "--dir", $d1, "--yes", "--no-shortcut")) -eq 0) "update failed"
          Must (Test-Path (Join-Path $d1 "server/data/card_master_full.csv.gz")) "update lost the card master"
          Must ((SettingValue (Join-Path $d1 "cafe_key.txt")) -eq "player-key") "update lost cafe_key.txt"
          Must ((Get-Content (Join-Path $d1 "installed-version.txt")) -eq "ci2") "update did not record the version"

          # 3. a PC with no client cache, no file given and the server not asked: installed, but says the card master
          #    is missing (exit 2). The server download itself is covered by the unit tests
          $d2 = Join-Path $env:RUNNER_TEMP "ov-nocache"
          $env:OPENVERSE_NO_SERVER_DOWNLOAD = "1"
          Must ((Run @("--zip", "OpenVerse.zip", "--dir", $d2, "--yes", "--no-shortcut")) -eq 2) "missing card master not reported"
          Remove-Item Env:OPENVERSE_NO_SERVER_DOWNLOAD
          Must (Test-Path (Join-Path $d2 "openverse-launcher.exe")) "nothing installed without a card master"

          # 4. the real thing: newest release downloaded from GitHub
          $d3 = Join-Path $env:RUNNER_TEMP "ov-download"
          Must ((Run @("--dir", $d3, "--card-master", $fake, "--yes", "--no-shortcut")) -eq 0) "install from the latest release failed"
          $v = Get-Content (Join-Path $d3 "installed-version.txt")
          Must ($v -like "v*") "unexpected release version '$v'"
          Must (Test-Path (Join-Path $d3 "server/OpenVerse.Api.exe")) "downloaded release not unpacked"

          # 5. removal the way '앱 및 기능' does it: the registered uninstaller copy, quietly. Install folder, shortcut,
          #    registry entry and (a moment later) the uninstaller copy itself are gone
          Must ((Run @("--zip", "OpenVerse.zip", "--tag", "ci3", "--dir", $d1, "--yes", "--shortcut-dir", $desk)) -eq 0) "reinstall before uninstall failed"
          $quiet = (Get-ItemProperty $key).QuietUninstallString
          Must ($quiet -like "*--yes*") "no quiet uninstall command"
          $p = Start-Process cmd.exe -ArgumentList "/c $quiet" -Wait -PassThru -NoNewWindow
          Must ($p.ExitCode -eq 0) "uninstall exited $($p.ExitCode)"
          Must (-not (Test-Path $d1)) "install folder left behind"
          Must (-not (Test-Path (Join-Path $desk "OpenVerse.lnk"))) "shortcut left behind"
          Must (-not (Test-Path $key)) "Programs and Features entry left behind"
          $un = Join-Path $env:LOCALAPPDATA "OpenVerse-Uninstall"
          for ($i = 0; $i -lt 20 -and (Test-Path $un); $i++) { Start-Sleep -Milliseconds 500 }
          Must (-not (Test-Path $un)) "uninstaller did not remove itself"

          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "::notice title=installer::OpenVerse-Installer.exe $mb MB: install, update, no-card-master, download-from-release ($v) and uninstall all passed"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenVerse-Installer-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.sha }}
          path: dist/installer/OpenVerse-Installer.exe
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          # downloading the artifact gives the zip contents directly (no zip inside a zip)
          name: OpenVerse-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.sha }}
          path: dist/OpenVerse
          retention-days: 90

      # the zip and the installer, for the publish job below
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-zip
          path: |
            OpenVerse.zip
            dist/installer/OpenVerse-Installer.exe
          retention-days: 7

  # A release per merge, with the zip attached as OpenVerse.zip, so players need no GitHub account and one link always
  # gives the newest: https://github.com/<owner>/<repo>/releases/latest/download/OpenVerse.zip
  publish:
    needs: zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # the only job allowed to write: creating the release and its tag
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f OpenVerse.zip
          test -f dist/installer/OpenVerse-Installer.exe
          day=$(TZ=Asia/Seoul date +%Y.%m.%d)
          short=${SHA::7}
          tag="v${day}-${short}"
          {
            echo "## 설치 (권장)"
            echo
            echo "1. \`OpenVerse-Installer.exe\`를 받아 실행합니다."
            echo "2. 카드 데이터는 셰도우버스 캐시에서 추출하고, 없으면 OpenVerse 서버에서 자동으로 받습니다. (서버에도 연결되지 않을 때만 파일 선택 창이 뜹니다)"
            echo "3. 바탕화면의 **OpenVerse** 바로가기로 실행합니다. 관리자 권한 요청은 허용합니다."
            echo
            echo "업데이트할 때도 인스톨러를 다시 실행하면 됩니다. 카드 마스터와 설정은 유지됩니다."
            echo "Windows가 '알 수 없는 게시자' 경고를 띄우면 '추가 정보' → '실행'을 누릅니다. (서명되지 않은 exe라서 뜹니다)"
            echo
            echo "## 수동 설치"
            echo
            echo "1. \`OpenVerse.zip\`을 받아 압축을 풉니다."
            echo "2. \`openverse-setup.exe\`를 실행합니다. (처음 한 번. 셰도우버스 클라이언트에서 카드 데이터를 추출합니다)"
            echo "3. \`openverse-launcher.exe\`를 실행합니다. 관리자 권한 요청은 허용합니다."
            echo
            echo "카드 데이터 캐시가 없는 PC는 setup과 런처가 OpenVerse 서버에서 카드 마스터를 받습니다."
            echo "셰도우버스 게임 데이터(카드 그림·음성 등)가 없거나 일부만 있어도, 게임을 켜면 없는 파일만 서버에서 받습니다. 처음 한 번은 오래 걸릴 수 있습니다."
            echo
            echo "\`be_url.txt\`는 \`${BE_URL}\`로 설정되어 있습니다. \`cafe_key.txt\`는 비어 있습니다."
            echo
            echo "항상 최신 인스톨러: https://github.com/${REPO}/releases/latest/download/OpenVerse-Installer.exe"
            echo "항상 최신 zip: https://github.com/${REPO}/releases/latest/download/OpenVerse.zip"
            echo
          } > notes.md
          gh release create "$tag" OpenVerse.zip dist/installer/OpenVerse-Installer.exe \
            --repo "$REPO" --target "$SHA" \
            --title "OpenVerse ${day} (${short})" \
            --notes-file notes.md --generate-notes --latest
          echo "::notice title=release::https://github.com/${REPO}/releases/tag/${tag}"
